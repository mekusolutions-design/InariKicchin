[build]
  command = "npm install --include=dev --workspace=@inari/web --include-workspace-root && npm run build -w @inari/web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  NPM_CONFIG_PRODUCTION = "false"
  # Web build does not need Prisma client generation
  SKIP_PRISMA_GENERATE = "1"
  INARI_SKIP_PRISMA = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
